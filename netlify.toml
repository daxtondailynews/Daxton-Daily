# No build step — this is a static HTML/CSS/JS site (see README.md) — so
# there's nothing to run, just files to publish, plus the scheduled
# function that sends the daily email.

[build]
  publish = "."
  functions = "netlify/functions"

# Runs send-daily-emails.js once a day. Cron is in UTC; 12:00 UTC is
# 8:00am US Eastern / 5:00am US Pacific — adjust to taste.
[functions."send-daily-emails"]
  schedule = "0 12 * * *"
