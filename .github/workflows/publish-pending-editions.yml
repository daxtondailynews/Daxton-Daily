name: Publish pending editions

# Publishes edition(s) staged under content/.pending/*.json.enc to Supabase
# via publish_edition() (see supabase/membership.sql), so paid content never
# sits in plaintext in this public repo or in a workflow log.
#
# Two ways a pending edition can be locked:
#  - Public key (what the morning routine uses): edition-DATE.json.enc is
#    AES-encrypted with a random one-time key, and edition-DATE.json.key is
#    that key encrypted with keys/edition-public.pem. Only this workflow
#    holds the private key (DAXTON_EDITION_PRIVATE_KEY secret), so the
#    routine needs no secret at all and nothing has to be kept in sync.
#  - Shared secret (manual uploads): a lone .json.enc encrypted with
#    DAXTON_PUBLISH_SECRET, as before.
#
# Runs automatically whenever a pending file (or the key check) is pushed,
# and can also be run by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "content/.pending/**"
      - "keys/**"
      - ".github/workflows/publish-pending-editions.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the edition private key
        env:
          DAXTON_EDITION_PRIVATE_KEY: ${{ secrets.DAXTON_EDITION_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DAXTON_EDITION_PRIVATE_KEY:-}" ]; then
            echo "::warning::DAXTON_EDITION_PRIVATE_KEY secret is not set; only shared-secret uploads can be published."
            exit 0
          fi
          # Rebuild the PEM from its base64 body so a paste that lost its line
          # breaks or picked up spaces/CRs still works.
          body=$(printf '%s' "$DAXTON_EDITION_PRIVATE_KEY" | sed 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/edition-private.pem"
          if ! openssl pkey -in "$RUNNER_TEMP/edition-private.pem" -pubout -out "$RUNNER_TEMP/derived-public.pem" 2>/dev/null; then
            has_begin=no; printf '%s' "$DAXTON_EDITION_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY' && has_begin=yes
            has_end=no; printf '%s' "$DAXTON_EDITION_PRIVATE_KEY" | grep -q 'END PRIVATE KEY' && has_end=yes
            echo "::error::DAXTON_EDITION_PRIVATE_KEY isn't a readable private key (secret is ${#DAXTON_EDITION_PRIVATE_KEY} chars, key body ${#body} chars - expected about 2480 and 2392; BEGIN line: $has_begin, END line: $has_end)."
            exit 1
          fi
          want=$(openssl pkey -pubin -in keys/edition-public.pem -pubout -outform DER | sha256sum | cut -c1-16)
          got=$(openssl pkey -pubin -in "$RUNNER_TEMP/derived-public.pem" -pubout -outform DER | sha256sum | cut -c1-16)
          if [ "$want" != "$got" ]; then
            echo "::error::DAXTON_EDITION_PRIVATE_KEY is a valid key but not the one matching keys/edition-public.pem (fingerprint $got, expected $want)."
            exit 1
          fi
          if ! openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/edition-private.pem" \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
              -in keys/keycheck.json.key -out "$RUNNER_TEMP/keycheck.pass"; then
            echo "::error::Key matches but couldn't unlock keys/keycheck.json.key."
            exit 1
          fi
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/keycheck.pass" \
              -in keys/keycheck.json.enc -out "$RUNNER_TEMP/keycheck.json"; then
            echo "::error::Unlocked the one-time key but couldn't decrypt keys/keycheck.json.enc."
            exit 1
          fi
          grep -q '"ok":true' "$RUNNER_TEMP/keycheck.json" || { echo "::error::keycheck decrypted to unexpected content."; exit 1; }
          rm -f "$RUNNER_TEMP/keycheck.pass" "$RUNNER_TEMP/keycheck.json"
          echo "::notice::Edition key OK (fingerprint $got)"

      - name: Publish each pending edition
        env:
          DAXTON_PUBLISH_SECRET: ${{ secrets.DAXTON_PUBLISH_SECRET }}
        run: |
          set -uo pipefail
          shopt -s nullglob

          if [ -z "${DAXTON_PUBLISH_SECRET:-}" ]; then
            echo "::error::DAXTON_PUBLISH_SECRET repo secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          URL=$(grep -oP 'SUPABASE_URL\s*=\s*"\K[^"]+' js/supabase-config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY\s*=\s*"\K[^"]+' js/supabase-config.js)

          files=(content/.pending/*.json.enc)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No pending editions to publish."
            exit 0
          fi

          published=()
          failed=0
          for f in "${files[@]}"; do
            plain="${f%.enc}.plain"
            body_file="${f%.enc}.body"
            keyfile="${f%.enc}.key"

            echo "Decrypting $f"
            if [ -f "$keyfile" ]; then
              pass="$RUNNER_TEMP/edition.pass"
              if ! { [ -f "$RUNNER_TEMP/edition-private.pem" ] \
                  && openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/edition-private.pem" \
                       -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
                       -in "$keyfile" -out "$pass" \
                  && openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass file:"$pass" -in "$f" -out "$plain"; }; then
                echo "::error::Couldn't decrypt $f with the edition private key"
                rm -f "$pass" "$plain"; failed=1; continue
              fi
              rm -f "$pass"
            elif ! openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:DAXTON_PUBLISH_SECRET -in "$f" -out "$plain"; then
              echo "::error::Couldn't decrypt $f with DAXTON_PUBLISH_SECRET"
              rm -f "$plain"; failed=1; continue
            fi

            if ! node -e '
              const fs = require("fs");
              const secret = process.env.DAXTON_PUBLISH_SECRET;
              const edition = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              fs.writeFileSync(process.argv[2], JSON.stringify({ secret, edition }));
            ' "$plain" "$body_file"; then
              echo "::error::$f didn't decrypt to valid JSON"
              rm -f "$plain" "$body_file"; failed=1; continue
            fi

            echo "Publishing $f"
            resp=$(curl -sS -X POST "$URL/rest/v1/rpc/publish_edition" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary @"$body_file")
            echo "Response: $resp"
            rm -f "$plain" "$body_file"

            if ! echo "$resp" | grep -qE '^[0-9]+$'; then
              echo "::error::publish_edition did not return a row count for $f"
              failed=1; continue
            fi

            published+=("$f")
            [ -f "$keyfile" ] && published+=("$keyfile")
          done

          rm -f "$RUNNER_TEMP/edition-private.pem"

          if [ ${#published[@]} -gt 0 ]; then
            git config user.name "daxton-daily-bot"
            git config user.email "actions@users.noreply.github.com"
            git rm -q "${published[@]}"
            git commit -m "Remove published pending edition(s)"
            git pull --rebase -q origin main
            git push
          fi

          exit $failed
