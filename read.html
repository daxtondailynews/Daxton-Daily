<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Paper</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/svg+xml" href="assets/logo-badge.svg">
<link rel="apple-touch-icon" href="assets/logo-badge.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#1B2A4A">
</head>
<body>
  <header class="brand-bar">
    <div class="brand-bar-inner">
      <a class="brand" href="index.html" aria-label="Daxton Daily home">
        <img class="brand-badge" src="assets/logo-badge.svg" alt="" width="38" height="38">
        <span class="brand-word"><span>Daxton</span><span>Daily</span></span>
      </a>
      <p class="brand-meta"><span id="brand-date"></span><span id="brand-edition"></span></p>
    </div>
  </header>
  <script src="js/brand.js"></script>

  <div class="wrap">
    <header class="masthead" id="masthead">
      <h1 id="masthead-title">The Daily Edition</h1>
      <p class="dateline"><span id="masthead-city"></span></p>
      <figure class="daily-quote hidden" id="masthead-quote"></figure>
    </header>

    <div class="page-nav" id="page-nav">
      <a href="read.html" id="archive-link" class="nav-link hidden">&larr; All editions</a>
      <a href="index.html" id="edit-link" class="nav-link">Edit my paper</a>
      <div class="print-row hidden" id="print-row">
        <button type="button" id="print-btn" class="secondary-btn">Print this edition</button>
      </div>
    </div>

    <main id="content-root"></main>
  </div>

  <footer class="site-footer">Daxton Daily · Not financial advice.</footer>

  <script src="js/topics.js"></script>
  <script src="js/cities.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/masthead.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
