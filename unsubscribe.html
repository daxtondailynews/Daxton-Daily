<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <p class="kicker">Daxton Daily Presents</p>
      <h1>Unsubscribe</h1>
    </header>

    <div class="intro">
      <p id="unsubscribe-message">Click below to stop the daily email. Your account and saved paper
      aren't affected — you can turn reminders back on anytime from your account settings.</p>
    </div>

    <div class="submit-row">
      <button type="button" class="primary-btn" id="unsubscribe-btn">Unsubscribe Me</button>
    </div>
    <div class="form-error" id="unsubscribe-error" style="text-align:center;"></div>
  </div>

  <footer class="site-footer">Daxton Daily · Not financial advice.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/unsubscribe.js"></script>
</body>
</html>
