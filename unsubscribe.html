<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/svg+xml" href="assets/logo-badge.svg">
<link rel="apple-touch-icon" href="assets/logo-badge.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#1B2A4A">
</head>
<body>
  <header class="brand-bar">
    <div class="brand-bar-inner">
      <a class="brand" href="index.html" aria-label="Daxton Daily home">
        <img class="brand-badge" src="assets/logo-badge.svg" alt="" width="38" height="38">
        <span class="brand-word"><span>Daxton</span><span>Daily</span></span>
      </a>
      <p class="brand-meta"><span id="brand-date"></span><span id="brand-edition"></span></p>
    </div>
  </header>
  <script src="js/brand.js"></script>

  <div class="wrap">
    <header class="masthead">
      <h1>Unsubscribe</h1>
    </header>

    <div class="intro">
      <p id="unsubscribe-message">Click below to stop the daily email. Your account and saved paper
      aren't affected — you can turn reminders back on anytime from your account settings.</p>
    </div>

    <div class="submit-row">
      <button type="button" class="primary-btn" id="unsubscribe-btn">Unsubscribe Me</button>
    </div>
    <div class="form-error" id="unsubscribe-error" style="text-align:center;"></div>
  </div>

  <footer class="site-footer">Daxton Daily · Not financial advice.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/unsubscribe.js"></script>
</body>
</html>
